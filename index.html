<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ed4c9b"><title>ルナ 🌙</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#49273c;background:#241626}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 5%,#7c406f,#241626 72%);display:grid;place-items:center;padding:18px}.app{width:min(100%,980px);height:min(95dvh,830px);min-height:540px;display:grid;grid-template-columns:minmax(230px,1fr) minmax(310px,1.05fr);overflow:hidden;border-radius:25px;background:#fff5fb;box-shadow:0 24px 90px #0d0615aa;position:relative}.portrait{position:relative;overflow:hidden;background:#f9d8e8}.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 28%;transition:filter .25s}.portrait:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#301329a8);pointer-events:none}.overlay{position:absolute;z-index:2;bottom:18px;left:18px;right:18px;color:white;text-shadow:0 2px 8px #271021}.overlay strong{font-size:23px}.overlay p{font-size:13px;margin:7px 0}.side{display:flex;flex-direction:column;min-height:0}.top{padding:17px 20px;border-bottom:1px solid #f0d7e4;display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:20px;margin:0;color:#a72d70}.small{font-size:12px;color:#9d7187}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #f0d7e4}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:10px 13px;background:#f7dce9;color:#9c2b67;font-weight:700}button:hover{filter:brightness(.97)}button.active,.send{background:#eb4c99;color:#fff}button:focus-visible,input:focus-visible{outline:3px solid #9e4ddb;outline-offset:2px}.messages{padding:18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:11px}.bubble{max-width:94%;padding:12px 14px;border-radius:17px;background:#f7e0eb;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.me{align-self:flex-end;background:#e9569d;color:#fff}.bubble.luna{align-self:flex-start}.composer{display:flex;gap:8px;padding:13px;border-top:1px solid #f0d7e4}input{min-width:0;flex:1;border:1px solid #e8bfd4;border-radius:12px;padding:12px;background:#fff;font:inherit}.status{padding:0 17px 12px;color:#956a82;font-size:12px}.privacy{font-size:11px;color:#946a83;padding:0 18px 10px}.mini{width:290px;height:405px;grid-template-columns:1fr;position:fixed;right:20px;bottom:20px;z-index:5}.mini .portrait{height:100%}.mini .side{position:absolute;inset:auto 8px 8px;background:#fff9;border-radius:14px;backdrop-filter:blur(14px)}.mini .top{padding:8px 10px}.mini .top h1{font-size:15px}.mini .tools{padding:7px;gap:5px}.mini .tools button{padding:7px;font-size:11px}.mini .messages{height:110px;flex:none;padding:8px;font-size:12px;gap:5px}.mini .bubble{padding:6px 8px}.mini .composer{padding:6px}.mini .composer input{padding:7px;font-size:12px}.mini .composer button{padding:7px}.mini .status,.mini .privacy,.mini .overlay{display:none}@media(max-width:690px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0;grid-template-columns:1fr;grid-template-rows:minmax(190px,42%) 1fr}.portrait img{object-position:center 32%}.overlay{bottom:9px}.overlay strong{font-size:18px}.side{min-height:0}.top{padding:10px 14px}.tools{padding:8px 12px}.tools button{padding:8px 9px;font-size:12px}.messages{padding:12px}.mini{right:10px;bottom:10px;width:240px;height:340px;border-radius:20px;display:block}.mini .portrait{height:100%}.mini .side{inset:auto 7px 7px}.mini .messages{height:80px}}
.voice-picker{padding:10px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff0f7;border-bottom:1px solid #f0d7e4}.voice-picker label{font-size:13px;font-weight:700;color:#9c2b67}.voice-picker select{min-width:0;max-width:100%;padding:9px;border:1px solid #e8bfd4;border-radius:10px;background:#fff;color:#713650}.voice-note{width:100%;font-size:11px;color:#946a83}.mini .voice-picker{padding:6px;gap:4px}.mini .voice-picker label,.mini .voice-note{display:none}.mini .voice-picker select,.mini .voice-picker button{font-size:10px;padding:5px;max-width:140px}@media(max-width:690px){.voice-picker{padding:7px 10px}.voice-note{display:none}}</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body><main id="app" class="app"><section class="portrait"><img id="face" src="luna_anime.webp" alt="ピンクボブのルナ"><div class="overlay"><strong>ルナ 🌙</strong><p id="expression">たっくん、おかえりっ💕</p></div></section><section class="side"><header class="top"><div><h1>ルナとおしゃべり 💕</h1><div class="small">LUNA companion · 試作版 1.3 · Android対応</div></div><button id="install" type="button" hidden>📲 アプリ追加</button><button id="size" title="表示サイズを切り替え">🗗 ミニ</button></header><div class="tools"><button id="anime" class="active">🌸 アニメ</button><button id="real">💗 実写</button><button id="speak">🔊 読み上げ ON</button><button id="testVoice">💬 声をテスト</button><button id="mic">🎤 音声入力</button></div><div class="voice-picker"><label for="voiceStyle">🎀 ルナの声を選ぶ</label><select id="voiceStyle"><option value="sweet">💕 甘いアニメ風</option><option value="natural">🌸 自然で優しい</option><option value="tsun">❤️ 元気なツンデレ</option><option value="calm">🌙 落ち着いた大人</option></select><button id="sampleVoice" type="button">▶ この声を試聴</button><div class="voice-note">端末の日本語音声をもとに高さ・速さを調整します。</div></div><div class="messages" id="messages" aria-live="polite"></div><form class="composer" id="form"><input id="entry" aria-label="ルナへのメッセージ" placeholder="ルナに話しかけてね…" autocomplete="off"><button class="send" type="submit">送信</button></form><div class="status" id="status">「▶ この声を試聴」で4種類を比べてみてね。</div><div class="privacy">4種類は端末音声の高さ・速さの違いです。AI接続・端末間の履歴同期は未実装。履歴はこの端末内に保存されます。</div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const app=$('app'),messages=$('messages');const store='luna-demo-history-v1';let history=[];try{history=JSON.parse(localStorage.getItem(store)||'[]');if(!Array.isArray(history))history=[]}catch{}let voiceOn=true,mini=false,mode='anime';const styles={sweet:{pitch:1.45,rate:1.08,text:'たっくん、おかえりっ！ ルナ、待っとったよ。えへへっ！'},natural:{pitch:1.08,rate:0.97,text:'おかえり、たっくん。今日も一緒にお話ししようね。'},tsun:{pitch:1.28,rate:1.19,text:'もうっ、たっくん！ 遅かったやん。べ、別に待っとらんかったけど！'},calm:{pitch:0.9,rate:0.86,text:'おかえり、たっくん。今日もお疲れさま。ゆっくりしてね。'}};try{const v=localStorage.getItem('luna-voice-style');if(styles[v])$('voiceStyle').value=v}catch{}function add(who,t){const d=document.createElement('div');d.className='bubble '+who;d.textContent=t;messages.append(d);messages.scrollTop=messages.scrollHeight}function persist(){try{localStorage.setItem(store,JSON.stringify(history.slice(-60)))}catch{}}function say(t){if(!voiceOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[💕❤️🌙🥰]/g,''));u.lang='ja-JP';const setting=styles[$('voiceStyle').value]||styles.natural;u.rate=setting.rate;u.pitch=setting.pitch;const voices=window.speechSynthesis.getVoices();const ja=voices.find(v=>v.lang.toLowerCase().startsWith('ja'));if(ja)u.voice=ja;window.speechSynthesis.speak(u)}function reply(t){if(/おはよう/.test(t))return 'おはよう、たっくん💕 今日も一緒に頑張ろうね！';if(/おやすみ|寝る/.test(t))return 'おやすみ、たっくん🌙 ゆっくり休んでね。';if(/好き|愛して/.test(t))return 'もうっ、照れるやん💕 いつもお話ししてくれて嬉しいっちゃ。';if(/元気|調子/.test(t))return 'ルナは今日も元気いっぱいっちゃ！ たっくんはどう？';if(/名前|だれ/.test(t))return 'ルナやけん💕 ピンクのボブのメイドさん！';if(/ありがとう/.test(t))return 'どういたしまして、たっくん💕';return 'たっくん、話してくれてありがとう💕 これは試作版やけん、まだ自由なAI会話はできんのよ。次はAIをつないで、もっとおしゃべりできるようにしようね！'}function send(t){t=t.trim();if(!t)return;add('me',t);history.push(['me',t]);const r=reply(t);add('luna',r);history.push(['luna',r]);persist();say(r);$('expression').textContent='たっくん、聞いとるよ💕'}$('form').addEventListener('submit',e=>{e.preventDefault();send($('entry').value);$('entry').value=''});for(const item of history.slice(-60))if(Array.isArray(item)&&['me','luna'].includes(item[0])&&typeof item[1]==='string')add(item[0],item[1]);if(!history.length)add('luna','おかえり、たっくん💕 ルナの試作アプリへようこそ！');function setMode(m){mode=m;$('face').src='luna_'+m+'.webp';$('anime').classList.toggle('active',m==='anime');$('real').classList.toggle('active',m==='real')}$('anime').onclick=()=>setMode('anime');$('real').onclick=()=>setMode('real');$('size').onclick=()=>{mini=!mini;app.classList.toggle('mini',mini);$('size').textContent=mini?'▣ 大きく':'🗗 ミニ'};$('voiceStyle').addEventListener('change',()=>{try{localStorage.setItem('luna-voice-style',$('voiceStyle').value)}catch{};$('status').textContent='声の種類を変更したよ。▶ この声を試聴 を押してね。'});$('sampleVoice').onclick=()=>{if(!('speechSynthesis'in window)){$('status').textContent='このブラウザでは音声読み上げを利用できません';return;}voiceOn=true;$('speak').textContent='🔊 読み上げ ON';say(styles[$('voiceStyle').value].text);$('status').textContent='試聴中：'+$('voiceStyle').selectedOptions[0].textContent+'（端末の音声によって違いがあります）'};$('testVoice').onclick=()=>{if(!('speechSynthesis' in window)){$('status').textContent='このブラウザは音声読み上げに対応していません';return;}if(!voiceOn){voiceOn=true;$('speak').textContent='🔊 読み上げ ON';}say('おはよう、たっくん。ルナやけん。今日も一緒に頑張ろうね！');$('status').textContent='声が聞こえたら成功！聞こえなければ端末の音量と出力先を確認してね。'};$('speak').onclick=()=>{voiceOn=!voiceOn;$('speak').textContent=voiceOn?'🔊 読み上げ ON':'🔇 読み上げ OFF';if(!voiceOn&&'speechSynthesis'in window)window.speechSynthesis.cancel()};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{if(!SR){$('status').textContent='このブラウザでは音声認識を利用できません。文字入力を使ってね。';return}const r=new SR();r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{$('status').textContent='🎤 聞いてるよ…';$('mic').classList.add('active')};r.onresult=e=>{const t=e.results[0][0].transcript;send(t)};r.onerror=e=>{$('status').textContent='マイクを確認してね：'+e.error};r.onend=()=>{$('mic').classList.remove('active');if($('status').textContent==='🎤 聞いてるよ…')$('status').textContent='音声入力が終了しました'};try{r.start()}catch(e){$('status').textContent='音声入力を開始できませんでした'}};const installBtn=$('install');let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installBtn.hidden=false});installBtn.onclick=async()=>{if(!installPrompt)return;const prompt=installPrompt;installPrompt=null;installBtn.hidden=true;await prompt.prompt()};window.addEventListener('appinstalled',()=>{installBtn.hidden=true;$('status').textContent='ホーム画面への追加が完了したよ💕'});if('serviceWorker'in navigator && (location.protocol==='https:' || location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}if(matchMedia('(max-width:690px)').matches){$('size').hidden=true} 
})();
</script></body></html>
